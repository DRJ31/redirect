# Use the latest 2.1 version of CircleCI pipeline process engine. See: https://circleci.com/docs/2.0/configuration-reference
version: 2.1
jobs:
  build:
    docker:
      - image: cimg/go:1.26.3
    steps:
      - checkout
      - add_ssh_keys:
          fingerprints:
            - "SHA256:N14dawQw0mkucf+EuKqi98Z124GNapu4gc+yKHkaR9M"
      - restore_cache:
          keys:
            - go-mod-v4-{{ checksum "go.sum" }}
      - run:
          name: Install Dependencies
          command: go mod download
      - save_cache:
          key: go-mod-v4-{{ checksum "go.sum" }}
          paths:
            - "/go/pkg/mod"
      - run:
          name: Build
          command: |
            go build
      - run:
          name: Build Docker Image
          command: |
            docker build -t dengrenjie31/hccapp-redirect .
      - run:
          name: Push Docker Image
          command: |
            docker login -u $DOCKER_USER -p $DOCKER_PASS
            docker push dengrenjie31/hccapp-redirect
      - run:
          name: Deploy to Server
          command: |
            ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts
            ssh $DEPLOY_USER@$DEPLOY_HOST \
              "docker pull dengrenjie31/hccapp-redirect && \
               docker compose up -d redirect"
